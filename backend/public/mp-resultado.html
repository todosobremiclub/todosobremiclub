<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resultado del pago</title>
  <style>
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial;}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f5f9;padding:16px;}
    .card{max-width:380px;width:100%;background:#fff;border-radius:18px;padding:32px 26px;box-shadow:0 25px 50px rgba(0,0,0,.15);text-align:center;}
    .icon{font-size:48px;margin-bottom:12px;}
    h1{font-size:20px;margin:0 0 8px;color:#0f172a;}
    p{font-size:14px;color:#64748b;margin:0;}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Procesando...</h1>
    <p id="msg">Ya podés cerrar esta pantalla y volver a la app.</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const estado = (params.get('estado') || '').toLowerCase();

    const textos = {
      success: { icon: '✅', title: 'Pago realizado', msg: 'Tu pago se procesó correctamente. Puede tardar unos segundos en verse acreditado en la app.' },
      pending: { icon: '🕒', title: 'Pago pendiente', msg: 'Tu pago está siendo procesado. Te avisaremos cuando se acredite.' },
      failure: { icon: '❌', title: 'Pago no realizado', msg: 'No se pudo procesar el pago. Podés volver a intentarlo desde la app.' }
    };

    const t = textos[estado] || { icon: 'ℹ️', title: 'Resultado del pago', msg: 'Ya podés cerrar esta pantalla y volver a la app.' };

    document.getElementById('icon').textContent = t.icon;
    document.getElementById('title').textContent = t.title;
    document.getElementById('msg').textContent = t.msg;
  </script>
</body>
</html>
