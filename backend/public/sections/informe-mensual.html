<!-- sections/informe-mensual.html -->
<section class="section-informe-mensual im-modern">
  <style>
    .im-modern .im-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
    .im-modern .im-title{margin:0;font-size:22px}
    .im-modern .im-sub{margin:2px 0 0;color:#6b7280;font-size:13px}
    .im-modern .im-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .im-modern select{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
    .im-modern .im-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
    .im-modern .im-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px}
    .im-modern .im-card h4{margin:0 0 4px;font-size:12px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .im-modern .im-big{font-size:24px;font-weight:700}
    .im-modern .im-note{font-size:12px;color:#6b7280;margin-top:2px}
    .im-modern .im-block{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:16px}
    .im-modern .im-block h3{margin:0 0 10px;font-size:16px}
    .im-modern table{width:100%;border-collapse:collapse;font-size:14px}
    .im-modern th,.im-modern td{text-align:left;padding:7px 8px;border-bottom:1px solid #f1f5f9}
    .im-modern th{font-size:12px;color:#6b7280}
    .im-modern .im-alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}
    .im-modern .im-alert.alta{background:#fef2f2;border:1px solid #fecaca}
    .im-modern .im-alert.media{background:#fffbeb;border:1px solid #fde68a}
    .im-modern .im-alert.info{background:#eff6ff;border:1px solid #bfdbfe}
    .im-modern .im-alert button{margin-left:auto;white-space:nowrap}
    .im-modern .im-muted{color:#6b7280;font-size:14px}
    .im-modern .im-badge{display:inline-block;background:#fef3c7;color:#92400e;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
    .im-modern .im-bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:6px}
    .im-modern .im-bar>span{display:block;height:100%;background:#2563eb}
    @media print{.im-modern .im-tools{display:none}}
  </style>

  <div class="im-head">
    <div>
      <h2 class="im-title">📈 Informe mensual</h2>
      <p class="im-sub">Resumen automático del uso de la plataforma: cobranza, socios con deuda, asistencia, comunicación y uso de la app.</p>
    </div>
    <div class="im-tools">
      <label>Período <select id="imPeriodo"></select></label>
      <button id="imRegenerar" class="btn" style="display:none;" title="Recalcula este mes con los datos de hoy">🔄 Regenerar</button>
      <button id="imImprimir" class="btn">🖨️ Imprimir</button>
    </div>
  </div>

  <div id="imEstado" class="im-muted">Cargando…</div>
  <div id="imContenido"></div>
</section>
